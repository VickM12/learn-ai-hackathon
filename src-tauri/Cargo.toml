[package]
name = "vineyard-journal"
version = "0.1.0"
description = "A local weather and vineyard journal"
authors = ["TwoBit Territories LLC"]
edition = "2021"

[lib]
name = "vineyard_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
